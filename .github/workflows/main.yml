name: Gemini AI Create React App and Deploy

on:
  push:
    branches:
      - main

jobs:
  ai-react-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      # Setup Node
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # Setup Python
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Gemini SDK
        run: pip install --upgrade google-genai

      # Create new React app
      - name: Create New React App
        run: |
          rm -rf ai-react-app
          npm create vite@latest ai-react-app -- --template react
          cd ai-react-app
          npm install

      # Gemini AI generates React files
      - name: Generate React UI using Gemini
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python << 'EOF'
          import os
          import re
          import subprocess
          from pathlib import Path
          from google import genai

          prompt = """
          Create a modern React e-commerce UI.

          Requirements:
          - React functional components
          - Header with cart counter
          - Product cards
          - Responsive grid layout
          - Clean Apple-style UI

          Output format:

          ---ai-react-app/src/App.jsx---
          full code

          ---ai-react-app/src/components/Header.jsx---
          full code

          ---ai-react-app/src/components/ProductCard.jsx---
          full code

          ---ai-react-app/src/styles.css---
          full code
          """

          client = genai.Client(api_key=os.environ["GEMINI_API_KEY"])

          response = client.models.generate_content(
              model="gemini-3.1-flash-lite-preview",
              contents=prompt
          )

          output = response.text

          matches = re.findall(
              r"---(.*?)---\n(.*?)(?=(?:---|$))",
              output,
              re.DOTALL
          )

          for filename, content in matches:
              path = Path(filename.strip())
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_text(content.strip(), encoding="utf-8")

          subprocess.run(["git","config","--global","user.name","gemini-bot"])
          subprocess.run(["git","config","--global","user.email","bot@example.com"])
          subprocess.run(["git","add","."])

          result = subprocess.run(["git","diff","--cached","--quiet"])

          if result.returncode != 0:
              subprocess.run(["git","commit","-m","Gemini AI generated React UI"])
              subprocess.run(["git","push"])
          EOF

      # Install dependencies
      - name: Install Dependencies
        run: |
          cd ai-react-app
          npm install

      # Build React app
      - name: Build React App
        run: |
          cd ai-react-app
          npm run build

      # Configure AWS
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1

      # Deploy to S3 (bucket name written directly)
      - name: Deploy to S3
        run: |
          aws s3 sync ai-react-app/dist s3://staticwebzsitegit --delete

      # Invalidate CloudFront
      - name: Invalidate CloudFront Cache
        run: |
          aws cloudfront create-invalidation \
          --distribution-id ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }} \
          --paths "/*"
