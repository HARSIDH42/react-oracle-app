name: Gemini AI Create Modern React App and Deploy

on:
  push:
    branches:
      - main

jobs:
  ai-react-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:

      - name: Checkout Repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Gemini SDK
        run: pip install --upgrade google-genai

      # Create new React Vite project
      - name: Create React App
        run: |
          rm -rf ai-react-app
          npm create vite@latest ai-react-app -- --template react
          cd ai-react-app
          npm install

      # Gemini generates modern UI
      - name: Generate Modern React UI using Gemini
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python << 'EOF'
          import os
          import re
          import subprocess
          from pathlib import Path
          from google import genai

          prompt = """
          ROLE
          You are a senior frontend engineer creating a premium modern React storefront.

          REQUIREMENTS
          - React + Vite
          - Functional components
          - Modern UI
          - Hero section
          - Responsive product grid
          - Cart counter
          - Glassmorphism navbar
          - Smooth hover animations
          - Clean typography

          IMPORTANT
          All components MUST use default export.

          OUTPUT FORMAT

          ---ai-react-app/src/App.jsx---
          import { useState } from "react"
          import Header from "./components/Header"
          import ProductCard from "./components/ProductCard"
          import "./styles.css"

          export default function App() {

            const [cart,setCart] = useState(0)

            const addToCart = () => {
              setCart(cart + 1)
            }

            const products = [
              {name:"Minimal Watch",price:"$120",icon:"⌚"},
              {name:"Wireless Headphones",price:"$199",icon:"🎧"},
              {name:"Smart Speaker",price:"$99",icon:"🔊"},
              {name:"VR Headset",price:"$399",icon:"🥽"}
            ]

            return (
              <div className="app">

                <Header cart={cart}/>

                <section className="hero">
                  <h1>Discover Modern Tech</h1>
                  <p>Premium devices for everyday life</p>
                </section>

                <section className="products">
                  {products.map((p,i)=>(
                    <ProductCard key={i} {...p} addToCart={addToCart}/>
                  ))}
                </section>

              </div>
            )
          }

          ---ai-react-app/src/components/Header.jsx---
          export default function Header({cart}) {
            return (
              <header className="header">
                <div className="logo">MODERN.STORE</div>
                <div className="cart">🛒 {cart}</div>
              </header>
            )
          }

          ---ai-react-app/src/components/ProductCard.jsx---
          export default function ProductCard({name,price,icon,addToCart}) {
            return (
              <div className="card">
                <div className="icon">{icon}</div>
                <h3>{name}</h3>
                <p>{price}</p>
                <button onClick={addToCart}>Add to Cart</button>
              </div>
            )
          }

          ---ai-react-app/src/styles.css---
          body{
            margin:0;
            font-family:Inter,system-ui;
            background:linear-gradient(135deg,#f3f4f6,#e5e7eb);
          }

          .header{
            backdrop-filter:blur(10px);
            background:rgba(255,255,255,.6);
            display:flex;
            justify-content:space-between;
            padding:20px 40px;
            position:sticky;
            top:0;
          }

          .logo{
            font-weight:bold;
            font-size:20px;
          }

          .hero{
            text-align:center;
            padding:80px 20px;
          }

          .hero h1{
            font-size:48px;
          }

          .products{
            display:grid;
            grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
            gap:30px;
            padding:40px;
          }

          .card{
            background:white;
            border-radius:16px;
            padding:30px;
            text-align:center;
            transition:.3s;
            box-shadow:0 10px 25px rgba(0,0,0,.1);
          }

          .card:hover{
            transform:translateY(-8px);
          }

          button{
            background:black;
            color:white;
            border:none;
            padding:12px 20px;
            border-radius:8px;
            cursor:pointer;
          }
          """

          client = genai.Client(api_key=os.environ["GEMINI_API_KEY"])

          response = client.models.generate_content(
              model="gemini-3.1-flash-lite-preview",
              contents=prompt
          )

          output = response.text

          matches = re.findall(
              r"---(.*?)---\n(.*?)(?=(?:---|$))",
              output,
              re.DOTALL
          )

          for filename, content in matches:
              path = Path(filename.strip())
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_text(content.strip(), encoding="utf-8")

          subprocess.run(["git","config","--global","user.name","gemini-bot"])
          subprocess.run(["git","config","--global","user.email","bot@example.com"])
          subprocess.run(["git","add","."])

          result = subprocess.run(["git","diff","--cached","--quiet"])

          if result.returncode != 0:
              subprocess.run(["git","commit","-m","Gemini AI generated modern React UI"])
              subprocess.run(["git","push"])
          EOF

      - name: Install Dependencies
        run: |
          cd ai-react-app
          npm install

      - name: Build React App
        run: |
          cd ai-react-app
          npm run build

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1

      - name: Deploy to S3
        run: |
          aws s3 sync ai-react-app/dist s3://${{ secrets.S3_BUCKET_NAME }} --delete

      - name: Invalidate CloudFront Cache
        run: |
          aws cloudfront create-invalidation \
          --distribution-id ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }} \
          --paths "/*"
