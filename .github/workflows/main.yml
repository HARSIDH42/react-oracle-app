name: Gemini AI Create Modern React App and Deploy

on:
  push:
    branches:
      - main

jobs:
  ai-react-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:

      - name: Checkout Repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Gemini SDK
        run: pip install --upgrade google-genai

      - name: Create React App
        run: |
          rm -rf ai-react-app
          npm create vite@latest ai-react-app -- --template react
          cd ai-react-app
          npm install

      - name: Generate Modern React UI using Gemini
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python << 'EOF'
          import os
          import re
          import subprocess
          from pathlib import Path
          from google import genai

          prompt = """
          ROLE
          You are a senior React frontend engineer creating a premium DESKTOP-FIRST e-commerce storefront.

          CRITICAL RULES
          - Desktop-first layout
          - Landscape design
          - Max container width 1400px
          - Centered layout
          - 4 column product grid on desktop
          - 2 columns tablet
          - 1 column mobile
          - Hero section full width
          - Modern typography

          DESIGN STYLE
          Apple / Stripe / Shopify style.

          IMPORTANT
          All React components MUST use default export.

          FILE OUTPUT

          ---ai-react-app/src/App.jsx---
          import { useState } from "react"
          import Header from "./components/Header"
          import ProductCard from "./components/ProductCard"
          import "./styles.css"

          export default function App(){

          const [cart,setCart] = useState(0)

          const addToCart=()=>setCart(cart+1)

          const products=[
          {name:"Zenith Watch",price:"$120",icon:"⌚"},
          {name:"Studio Headphones",price:"$199",icon:"🎧"},
          {name:"Smart Speaker",price:"$99",icon:"🔊"},
          {name:"VR Headset",price:"$399",icon:"🥽"},
          {name:"Wireless Mouse",price:"$49",icon:"🖱️"},
          {name:"Mechanical Keyboard",price:"$159",icon:"⌨️"},
          {name:"Drone Camera",price:"$499",icon:"🚁"},
          {name:"4K Monitor",price:"$799",icon:"🖥️"}
          ]

          return(
          <div>

          <Header cart={cart}/>

          <section className="hero">
          <div className="container">
          <h1>Engineered for <span>Excellence.</span></h1>
          <p>Discover a curated selection of premium electronics designed to elevate your daily workflow.</p>
          </div>
          </section>

          <section className="container grid">
          {products.map((p,i)=>(
          <ProductCard key={i} {...p} addToCart={addToCart}/>
          ))}
          </section>

          </div>
          )
          }

          ---ai-react-app/src/components/Header.jsx---
          export default function Header({cart}){

          return(
          <header className="header">

          <div className="container nav">

          <div className="logo">
          MODERN<span>STORE</span>
          </div>

          <nav className="links">
          <a>Products</a>
          <a>Support</a>
          </nav>

          <div className="cart">
          Cart <span>{cart}</span>
          </div>

          </div>

          </header>
          )
          }

          ---ai-react-app/src/components/ProductCard.jsx---
          export default function ProductCard({name,price,icon,addToCart}){

          return(
          <div className="card">

          <div className="icon">{icon}</div>

          <h3>{name}</h3>

          <p>{price}</p>

          <button onClick={addToCart}>
          Add to Cart
          </button>

          </div>
          )
          }

          ---ai-react-app/src/styles.css---

          body{
          margin:0;
          font-family:Inter,system-ui;
          background:#f5f6fa;
          }

          .container{
          max-width:1400px;
          margin:auto;
          padding:0 40px;
          }

          .header{
          background:white;
          border-bottom:1px solid #eee;
          }

          .nav{
          display:flex;
          align-items:center;
          justify-content:space-between;
          height:70px;
          }

          .logo{
          font-weight:700;
          font-size:20px;
          }

          .logo span{
          color:#6366f1;
          }

          .links{
          display:flex;
          gap:30px;
          }

          .cart span{
          background:black;
          color:white;
          padding:4px 10px;
          border-radius:20px;
          margin-left:6px;
          }

          .hero{
          padding:120px 0 60px;
          }

          .hero h1{
          font-size:64px;
          }

          .hero span{
          color:#6366f1;
          }

          .hero p{
          font-size:18px;
          margin-top:20px;
          max-width:600px;
          }

          .grid{
          display:grid;
          grid-template-columns:repeat(4,1fr);
          gap:30px;
          margin-top:40px;
          }

          .card{
          background:white;
          border-radius:16px;
          padding:30px;
          text-align:center;
          transition:.25s;
          box-shadow:0 10px 20px rgba(0,0,0,.08);
          }

          .card:hover{
          transform:translateY(-6px);
          }

          .icon{
          font-size:48px;
          margin-bottom:20px;
          }

          button{
          margin-top:12px;
          background:black;
          color:white;
          border:none;
          padding:12px 18px;
          border-radius:8px;
          cursor:pointer;
          }

          @media(max-width:1000px){

          .grid{
          grid-template-columns:repeat(2,1fr);
          }

          .hero h1{
          font-size:42px;
          }

          }

          @media(max-width:600px){

          .grid{
          grid-template-columns:1fr;
          }

          .hero h1{
          font-size:32px;
          }

          }
          """

          client = genai.Client(api_key=os.environ["GEMINI_API_KEY"])

          response = client.models.generate_content(
              model="gemini-3.1-flash-lite-preview",
              contents=prompt
          )

          output = response.text

          matches = re.findall(
              r"---(.*?)---\n(.*?)(?=(?:---|$))",
              output,
              re.DOTALL
          )

          for filename, content in matches:
              path = Path(filename.strip())
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_text(content.strip(), encoding="utf-8")
          EOF

      - name: Install Dependencies
        run: |
          cd ai-react-app
          npm install

      - name: Build React App
        run: |
          cd ai-react-app
          npm run build

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1

      - name: Deploy to S3
        run: |
          aws s3 sync ai-react-app/dist s3://${{ secrets.S3_BUCKET_NAME }} --delete

      - name: Invalidate CloudFront Cache
        run: |
          aws cloudfront create-invalidation \
          --distribution-id ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }} \
          --paths "/*"
