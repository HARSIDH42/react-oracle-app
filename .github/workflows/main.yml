name: Gemini AI Create React App and Deploy

on:
  push:
    branches:
      - main

jobs:
  ai-react-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      # Setup Node
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # Setup Python
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Gemini SDK
        run: pip install --upgrade google-genai

      # Create new React app
      - name: Create New React App
        run: |
          rm -rf ai-react-app
          npm create vite@latest ai-react-app -- --template react
          cd ai-react-app
          npm install

      # Gemini AI generates React components
      - name: Generate React UI using Gemini
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python << 'EOF'
          import os
          import re
          import subprocess
          from pathlib import Path
          from google import genai

          prompt = """
          Create a modern React e-commerce UI.

          IMPORTANT:
          All React components MUST use default export.
          Example: export default function ComponentName() {}

          Files to generate:

          ---ai-react-app/src/App.jsx---
          import Header from "./components/Header.jsx"
          import ProductCard from "./components/ProductCard.jsx"
          import "./styles.css"

          export default function App() {
            return (
              <div>
                <Header />
                <h1>AI React Store</h1>
                <div className="products">
                  <ProductCard name="Product 1" price="$20" />
                  <ProductCard name="Product 2" price="$30" />
                </div>
              </div>
            )
          }

          ---ai-react-app/src/components/Header.jsx---
          export default function Header() {
            return (
              <header className="header">
                <h2>AI Store</h2>
                <span className="cart">Cart (0)</span>
              </header>
            )
          }

          ---ai-react-app/src/components/ProductCard.jsx---
          export default function ProductCard({ name, price }) {
            return (
              <div className="card">
                <h3>{name}</h3>
                <p>{price}</p>
                <button>Add to Cart</button>
              </div>
            )
          }

          ---ai-react-app/src/styles.css---
          body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background: #f5f5f5;
          }

          .header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 30px;
          }

          .products {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px,1fr));
            gap: 20px;
          }

          .card {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
          }

          button {
            background: black;
            color: white;
            border: none;
            padding: 10px;
            cursor: pointer;
          }
          """

          client = genai.Client(api_key=os.environ["GEMINI_API_KEY"])

          response = client.models.generate_content(
              model="gemini-3.1-flash-lite-preview",
              contents=prompt
          )

          output = response.text

          matches = re.findall(
              r"---(.*?)---\n(.*?)(?=(?:---|$))",
              output,
              re.DOTALL
          )

          for filename, content in matches:
              path = Path(filename.strip())
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_text(content.strip(), encoding="utf-8")

          subprocess.run(["git","config","--global","user.name","gemini-bot"])
          subprocess.run(["git","config","--global","user.email","bot@example.com"])
          subprocess.run(["git","add","."])

          result = subprocess.run(["git","diff","--cached","--quiet"])

          if result.returncode != 0:
              subprocess.run(["git","commit","-m","Gemini AI generated React UI"])
              subprocess.run(["git","push"])
          EOF

      # Install dependencies
      - name: Install Dependencies
        run: |
          cd ai-react-app
          npm install

      # Build React
      - name: Build React App
        run: |
          cd ai-react-app
          npm run build

      # AWS login
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1

      # Deploy to S3 using secret bucket name
      - name: Deploy to S3
        run: |
          aws s3 sync ai-react-app/dist s3://${{ secrets.S3_BUCKET_NAME }} --delete

      # Clear CloudFront cache
      - name: Invalidate CloudFront Cache
        run: |
          aws cloudfront create-invalidation \
          --distribution-id ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }} \
          --paths "/*"
